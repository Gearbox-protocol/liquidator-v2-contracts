name: Release

on:
  push:
    branches:
      - "main"
      - "next"

env:
  HUSKY: 0
  CI: true

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          cache: "yarn"
          node-version-file: ".nvmrc"

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      # set and unset github token to pull private dependencies
      - name: Install dependencies
        run: |
          git config --global url."https://${secrets.LIQ_CONTRACTS_PAT}@github.com/".insteadOf "https://github.com/"
          forge install
          yarn install --frozen-lockfile
          git config --global --unset url."https://${secrets.LIQ_CONTRACTS_PAT}@github.com/".insteadOf

      - name: Build
        run: |
          yarn build

      - name: Semantic Release
        uses: cycjimmy/semantic-release-action@v4
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
